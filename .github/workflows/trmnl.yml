name: TRMNL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the snapshots in tests/snapshots and upload them
        type: boolean
        default: false

env:
  # The trmnlp image the tests run in. Pin a release (e.g. trmnl/trmnlp:v0.22.0) to keep runs repeatable.
  TRMNLP_IMAGE: trmnl/trmnlp:latest

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: trmnlp test
        run: >
          docker run --rm --tmpfs /tmp --entrypoint /app/bin/trmnlp
          -e CI=true -e GITHUB_STEP_SUMMARY=/summary.md
          -v "$PWD":/plugin -v "$GITHUB_STEP_SUMMARY":/summary.md "$TRMNLP_IMAGE"
          test --report report ${{ inputs.update_snapshots && '--update' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmnlp-report
          path: report
      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: tests/snapshots

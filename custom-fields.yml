# ============================================================================
# Custom Form Fields Reference (custom-fields.yml)
# ============================================================================
# Docs: https://help.trmnl.com/en/articles/10513740-custom-plugin-form-builder
# Visual Builder: https://trmnl.com/form-builder
#
# HOW THIS FILE IS USED:
# - In the TRMNL Web UI: Paste this YAML into the "Form Fields" box in your
#   Private Plugin settings.
# - In ZIP Exports / GitHub Sync / `trmnlp`: Nest this list under the
#   `custom_fields:` key inside `settings.yml`.
#
# ACCESSING VALUES:
# - In Liquid Markup:
#     {{ trmnl.plugin_settings.custom_fields_values.api_key }}
# - In Polling URL, Polling Headers, or Polling Body:
#     https://api.example.com/v1/data?api_key={{ api_key | url_encode }}
#     authorization: Bearer {{ api_key }}
#
# REQUIRED KEYS FOR EVERY FIELD:
# - keyname:    Parameterized identifier (snake_case), e.g., `api_key`
# - field_type: One of the supported TRMNL field types below
# - name:       User-facing field label
#
# OPTIONAL KEYS:
# - description:        Secondary label (HTML-friendly)
# - description-LOCALE: Localized description (e.g., `description-de`, `description-es-ES`)
# - help_text:          Tertiary label (HTML-friendly)
# - optional:           Boolean. Fields are REQUIRED by default unless `optional: true` is set!
# - default:            Default value if blank (for `select`, must be lowercase parameterized value)
# - placeholder:        Example value when input is empty (supported on url, string, text, number, code)
# - group:              Combines multiple fields into a collapsible accordion section
# - conditional_validation: Dynamically show/hide or require other fields based on this field's value
#
# SUPPORTED FIELD TYPES (`field_type`):
# - author_bio:             Plugin README block (required by Chef linter for publishing Recipes)
# - string:                 Single-line text input (supports `maxlength`, `placeholder`)
# - password:               Masked single-line input for API keys/secrets
# - text:                   Multi-line textarea (supports `rows`, `maxlength`, `placeholder`)
# - code:                   Monospace multi-line textarea (supports `rows`, `placeholder`)
# - number:                 Numeric input (supports `min`, `max`, `step`, `placeholder`)
# - boolean:                Checkbox toggle (`default: true` or `default: false`)
# - select:                 Dropdown menu (`options` array, `multiple: true` for multi-select; values stored lowercase!)
# - url:                    URL input with validation
# - date:                   Date picker (YYYY-MM-DD; `default: "today"` supported)
# - time:                   Time picker (HH:SS)
# - time_zone:              Time zone selector
# - multi_string:           Multiple comma-separated values
# - lat_lon:                Latitude/Longitude coordinate input
# - copyable:               Read-only text with click-to-copy button (requires `value`)
# - copyable_webhook_url:   Click-to-copy button auto-populated with the plugin's Webhook URL
# - plugin_instance_select: Dropdown of user's active plugin instances (for `plugin_merge` strategy)
# - xhrSelect:              Dynamic dropdown populated from `endpoint:` (client-side) or `remote:` (server-side)
# - xhrSelectSearch:        Searchable dynamic dropdown populated from `endpoint:`
# ============================================================================

# 1. Author Bio (Required by Chef linter when publishing as a Recipe)
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: productivity,utilities
  description: >-
    A template plugin for TRMNL ePaper devices built with TRMNL Framework 3.4.
  github_url: https://github.com/hossain-khan/trmnl-plugin-template
  learn_more_url: https://help.trmnl.com/en/articles/9510536-private-plugins
  email_address: support@example.com

# 2. Password / Secret Field (Recommended for API keys)
- keyname: api_key
  field_type: password
  name: API Key
  description: Required for authenticating with the data service
  placeholder: sk_live_...
  optional: true

# 3. Select Field with Conditional Validation
# Note: Option values are stored in lowercase (e.g. "Source A" -> "source_a", or use "Label: value")
- keyname: data_source
  field_type: select
  name: Data Source
  description: Select which data source to display
  options:
    - "Source A: source_a"
    - "Source B: source_b"
    - "Custom URL: custom"
  default: source_a
  conditional_validation:
    - when: custom
      visible:
        - custom_endpoint_url
      required:
        - custom_endpoint_url

# 4. Conditionally Visible URL Field (hidden unless `data_source` == `custom`)
- keyname: custom_endpoint_url
  field_type: url
  name: Custom Endpoint URL
  placeholder: https://api.example.com/data
  description: Custom JSON endpoint to poll when Data Source is set to Custom URL
  optional: true

# 5. Boolean Toggle Field
- keyname: show_details
  field_type: boolean
  name: Show Additional Details
  description: Display secondary metrics and footer details in the layout
  default: true
  optional: true

# 6. Number Field with Bounds
- keyname: max_items
  field_type: number
  name: Maximum Items
  placeholder: 5
  min: 1
  max: 20
  step: 1
  default: 5
  group: Display Preferences
  optional: true

# 7. Single-Line String Field
- keyname: custom_title
  field_type: string
  name: Custom Plugin Title
  placeholder: Enter a custom title (optional)
  maxlength: 40
  description: Leave blank to use the plugin's default instance name
  group: Display Preferences
  optional: true
